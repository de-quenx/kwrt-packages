name: Sync Repository Data

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "URL atau owner/repo sumber (contoh: https://github.com/user/repoA.git atau user/repoA)"
        required: true
        type: string
      target_url:
        description: "URL atau owner/repo tujuan (contoh: https://github.com/user/repoB.git atau user/repoB)"
        required: true
        type: string
      commit_message:
        description: "Pesan commit"
        required: false
        default: "sync: update data dari repository sumber"
        type: string

jobs:
  sync-repository:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Konfigurasi Identitas Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Tentukan Nama Direktori
        run: |
          SOURCE_INPUT="${{ inputs.source_url }}"
          TARGET_INPUT="${{ inputs.target_url }}"
          SOURCE_INPUT="${SOURCE_INPUT%/}"
          TARGET_INPUT="${TARGET_INPUT%/}"
          SOURCE_NAME=$(basename "$SOURCE_INPUT" .git)
          TARGET_NAME=$(basename "$TARGET_INPUT" .git)
          echo "SOURCE_NAME=$SOURCE_NAME" >> "$GITHUB_ENV"
          echo "TARGET_NAME=$TARGET_NAME" >> "$GITHUB_ENV"

      - name: Clone Repository Sumber
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: |
          SOURCE_URL="${{ inputs.source_url }}"
          if [[ "$SOURCE_URL" != http*://* ]]; then
            SOURCE_URL="https://github.com/${SOURCE_URL}.git"
          fi
          if [ -n "$SOURCE_TOKEN" ]; then
            SOURCE_URL=$(echo "$SOURCE_URL" | sed "s#https://#https://x-access-token:${SOURCE_TOKEN}@#")
          fi
          git clone --branch main --single-branch --depth 1 "$SOURCE_URL" source-repo

      - name: Clone Repository Tujuan
        env:
          TARGET_TOKEN: ${{ secrets.TARGET_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          TARGET_URL="${{ inputs.target_url }}"
          if [[ "$TARGET_URL" != http*://* ]]; then
            TARGET_URL="https://github.com/${TARGET_URL}.git"
          fi
          if [ -n "$TARGET_TOKEN" ]; then
            TARGET_URL=$(echo "$TARGET_URL" | sed "s#https://#https://x-access-token:${TARGET_TOKEN}@#")
          fi
          if git ls-remote --exit-code --heads "$TARGET_URL" main > /dev/null 2>&1; then
            git clone --branch main --single-branch --depth 1 "$TARGET_URL" target-repo
          else
            git clone --depth 1 "$TARGET_URL" target-repo
            cd target-repo
            git checkout -b main
          fi

      - name: Validasi Direktori Sumber
        run: |
          SRC="source-repo/${{ env.SOURCE_NAME }}"
          if [ ! -e "$SRC" ]; then
            echo "Direktori sumber tidak ditemukan: ${{ env.SOURCE_NAME }}"
            exit 1
          fi

      - name: Hapus Atau Buat Direktori Tujuan
        run: |
          DEST="target-repo/${{ env.TARGET_NAME }}"
          if [ -e "$DEST" ]; then
            rm -rf "$DEST"
          fi
          mkdir -p "$DEST"

      - name: Salin Data Dari Sumber Ke Tujuan
        run: |
          SRC="source-repo/${{ env.SOURCE_NAME }}"
          DEST="target-repo/${{ env.TARGET_NAME }}"
          rsync -a \
            --exclude=".git" \
            --exclude="doc" \
            --exclude="doc/**" \
            --exclude="*.md" \
            --exclude="*.jpg" \
            --exclude="*.jpeg" \
            --exclude="[Vv][Ee][Rr][Ss][Ii][Oo][Nn]*" \
            --exclude="[Ll][Ii][Cc][Ee][Nn][Ss][Ee]*" \
            "$SRC"/ "$DEST"/

      - name: Commit Dan Push Ke Repository Tujuan
        run: |
          cd target-repo
          git add -A
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan untuk di-commit"
            exit 0
          fi
          git commit -m "${{ inputs.commit_message }}"
          git push origin HEAD:main
